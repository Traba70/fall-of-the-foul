<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0a08">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fall of the Foul">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap">
<title>Fall of the Foul</title>
<style>
  :root{
    --bg:#0b0a08; --bg2:#141210; --panel:#1a1713; --panel2:#221d17;
    --ink:#d8cdb8; --ink-dim:#8f8571; --gold:#c8a862; --gold-bright:#e7cf95;
    --blood:#8a1c1c; --blood-bright:#c0392b; --steel:#8a94a0; --edge:#3a3226;
    --hp:#a3242a; --mana:#2f6fb0; --stam:#4b8f3e; --soul:#d9c37a;
    --shadow:0 6px 22px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:"Palatino Linotype","Book Antiqua",Georgia,"Times New Roman",serif;
    -webkit-user-select:none; user-select:none; touch-action:none;
    overscroll-behavior:none;
  }
  #app{
    position:fixed; inset:0;
    max-width:560px; margin:0 auto;
    background:
      radial-gradient(120% 80% at 50% -10%, #1c1813 0%, var(--bg) 55%),
      var(--bg);
    display:flex; flex-direction:column;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    overflow:hidden;
  }
  .screen{position:absolute; inset:0; display:none; flex-direction:column;}
  .screen.active{display:flex;}

  /* ---------- generic gothic pieces ---------- */
  .gothic{font-family:"Palatino Linotype","Book Antiqua",Georgia,serif;}
  .title{
    font-size:clamp(18px,5.4vw,30px); letter-spacing:.1em; text-transform:uppercase;
    color:var(--gold-bright); text-align:center; font-weight:700; white-space:nowrap;
    text-shadow:0 2px 0 #000, 0 0 18px rgba(200,168,98,.35);
  }
  .subtitle{color:var(--ink-dim); text-align:center; letter-spacing:.35em; text-transform:uppercase; font-size:11px;}
  .rule{height:1px; background:linear-gradient(90deg,transparent,var(--edge) 20%,var(--gold) 50%,var(--edge) 80%,transparent); opacity:.7; margin:8px 0;}

  .btn{
    font-family:inherit; color:var(--ink); background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--edge); border-radius:7px; padding:12px 14px; font-size:15px; letter-spacing:.06em;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05), var(--shadow); cursor:pointer;
    transition:transform .05s, border-color .15s, color .15s;
  }
  .btn:active{transform:translateY(1px) scale(.99); border-color:var(--gold);}
  .btn.gold{color:#1a1508; background:linear-gradient(180deg,var(--gold-bright),var(--gold)); border-color:#8a6d33; font-weight:700; text-transform:uppercase; letter-spacing:.1em;}
  .btn.ghost{background:transparent; border-color:var(--edge); color:var(--ink-dim);}
  .btn.danger{border-color:#5a2020; color:#e0a0a0;}
  .btn:disabled{opacity:.4; cursor:default;}

  /* ---------- top bar ---------- */
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:12px 14px 6px; gap:10px;}
  .stat-chip{display:flex; align-items:center; gap:5px; font-size:12px; color:var(--ink); background:rgba(0,0,0,.3); border:1px solid var(--edge); border-radius:20px; padding:5px 10px; white-space:nowrap;}
  .stat-chip b{color:var(--gold-bright); font-weight:700;}
  .stat-chip.soul b{color:var(--soul);}

  /* ---------- home ---------- */
  #s-home .hero-stage{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative;}
  #portrait{width:min(72vw,320px); height:min(72vw,320px); filter:drop-shadow(0 24px 30px rgba(0,0,0,.6));}
  .class-tag{margin-top:2px; color:var(--gold); letter-spacing:.3em; text-transform:uppercase; font-size:12px;}
  .plinth{position:absolute; bottom:8%; width:60%; height:26px; border-radius:50%; background:radial-gradient(50% 50% at 50% 50%,rgba(200,168,98,.18),transparent 70%); filter:blur(2px);}

  /* ---------- bottom nav ---------- */
  .navbar{display:flex; align-items:flex-end; justify-content:center; gap:12px; padding:10px 14px calc(14px + env(safe-area-inset-bottom));}
  .nav-btn{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 6px; border-radius:10px;
    background:linear-gradient(180deg,var(--panel2),var(--panel)); border:1px solid var(--edge); color:var(--ink-dim);
    box-shadow:var(--shadow); cursor:pointer;}
  .nav-btn .glyph{width:30px; height:30px;}
  .nav-btn .lbl{font-size:12px; letter-spacing:.12em; text-transform:uppercase;}
  .nav-btn:active{transform:translateY(1px);}
  .nav-btn.fight{flex:1.4; background:linear-gradient(180deg,#3a1414,#230d0d); border-color:#5c2222; color:var(--gold-bright);}
  .nav-btn.fight .lbl{color:var(--gold-bright); font-weight:700;}
  .nav-btn.fight .glyph{width:38px; height:38px;}

  /* ---------- panels (gear / levelup) ---------- */
  .panel-head{display:flex; align-items:center; justify-content:space-between; padding:12px 14px 4px;}
  .panel-head .h{font-size:20px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold-bright);}
  .scroll{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:6px 14px 20px; touch-action:pan-y;}
  .scroll::-webkit-scrollbar{width:6px;} .scroll::-webkit-scrollbar-thumb{background:var(--edge); border-radius:3px;}

  .card{background:linear-gradient(180deg,var(--panel),var(--bg2)); border:1px solid var(--edge); border-radius:10px; padding:12px; box-shadow:var(--shadow);}
  .card + .card{margin-top:12px;}
  .card-title{color:var(--gold); letter-spacing:.1em; text-transform:uppercase; font-size:12px; margin-bottom:8px;}

  /* class switch */
  .seg{display:flex; gap:8px;}
  .seg .opt{flex:1; text-align:center; padding:10px 4px; border:1px solid var(--edge); border-radius:8px; background:var(--panel2); color:var(--ink-dim); font-size:13px; letter-spacing:.08em; text-transform:uppercase;}
  .seg .opt.sel{border-color:var(--gold); color:var(--gold-bright); background:linear-gradient(180deg,#2a2318,#1c1712);}

  /* pixel-art item icons: keep hard edges when scaled */
  .icn, .icn-lg, #portrait{image-rendering:pixelated; image-rendering:crisp-edges;}
  /* equipment grid */
  .slots{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .slot{display:flex; align-items:center; gap:10px; padding:9px; border:1px solid var(--edge); border-radius:9px; background:var(--panel2);}
  .slot.empty{opacity:.6;}
  .slot .icn{width:40px; height:40px; flex:none; border-radius:7px; background:#0d0b09; border:1px solid var(--edge);}
  .slot .meta{min-width:0;}
  .slot .nm{font-size:12.5px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .slot .sub{font-size:10.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.08em;}
  .slot .lv{font-size:10.5px; color:var(--gold);}

  /* stats readout */
  .statgrid{display:grid; grid-template-columns:1fr 1fr; gap:6px 14px;}
  .statrow{display:flex; justify-content:space-between; font-size:13px; padding:3px 0; border-bottom:1px dotted rgba(120,110,90,.18);}
  .statrow .k{color:var(--ink-dim);} .statrow .v{color:var(--gold-bright); font-weight:700;}

  .setline{font-size:12px; color:var(--steel); margin-top:6px;} .setline.active{color:var(--gold-bright);}
  .buffline{font-size:11.5px; color:var(--ink-dim); margin-top:3px;}
  .buffline b{color:var(--gold);}

  /* inventory list */
  .inv{display:grid; grid-template-columns:1fr; gap:8px;}
  .inv-item{display:flex; align-items:center; gap:10px; padding:9px; border:1px solid var(--edge); border-radius:9px; background:var(--panel2);}
  .inv-item.equipped{border-color:var(--gold);}
  .inv-item .grow{flex:1; min-width:0;}
  .inv-item .nm{font-size:13px;} .inv-item .sub{font-size:10.5px; color:var(--ink-dim);}
  .tag{font-size:9.5px; text-transform:uppercase; letter-spacing:.1em; padding:2px 6px; border-radius:10px; border:1px solid var(--edge); color:var(--ink-dim);}
  .tag.melee{color:#d98b6a; border-color:#5a3b2a;}
  .tag.ranged{color:#8fbf6a; border-color:#3f5a2a;}
  .tag.magic{color:#7aa6d9; border-color:#2a3f5a;}
  .tag.on{color:var(--gold-bright); border-color:var(--gold);}

  /* level-up rows */
  .lvrow{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px dotted rgba(120,110,90,.18);}
  .lvrow .info{flex:1; min-width:0;}
  .lvrow .nm{font-size:15px; color:var(--ink);}
  .lvrow .ds{font-size:11px; color:var(--ink-dim);}
  .lvrow .val{font-size:18px; color:var(--gold-bright); font-weight:700; width:38px; text-align:center;}
  .plus{width:44px; height:44px; border-radius:8px; border:1px solid var(--edge); background:linear-gradient(180deg,var(--panel2),var(--panel)); color:var(--gold-bright); font-size:22px; display:flex; align-items:center; justify-content:center;}
  .plus:disabled{opacity:.35;}
  .cost{font-size:10px; color:var(--soul); text-align:center; margin-top:2px;}

  /* ---------- arena ---------- */
  #s-arena{background:#000;}
  #game{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none;}
  #arena-hud{position:absolute; top:0; left:0; right:0; padding:10px 12px calc(env(safe-area-inset-top)); pointer-events:none;}
  .bars{display:flex; flex-direction:column; gap:5px; max-width:60%;}
  .bar{height:12px; border:1px solid rgba(0,0,0,.6); border-radius:3px; background:rgba(0,0,0,.55); position:relative; overflow:hidden; box-shadow:0 1px 0 rgba(255,255,255,.06);}
  .bar > i{position:absolute; inset:0; transform-origin:left; display:block;}
  .bar.hp > i{background:linear-gradient(180deg,#d24a4a,var(--hp));}
  .bar.mana > i{background:linear-gradient(180deg,#4a90d2,var(--mana));}
  .bar.stam{height:7px;} .bar.stam > i{background:linear-gradient(180deg,#79c463,var(--stam));}
  .bar .txt{position:absolute; inset:0; font-size:9px; color:#eee; text-align:center; line-height:12px; text-shadow:0 1px 1px #000;}
  .arena-top-right{position:absolute; top:10px; right:12px; text-align:right; pointer-events:none;}
  .wave-lbl{font-size:13px; color:var(--gold-bright); letter-spacing:.14em; text-transform:uppercase; text-shadow:0 1px 2px #000;}
  .souls-lbl{font-size:12px; color:var(--soul); text-shadow:0 1px 2px #000;}
  #boss-bar{position:absolute; left:8%; right:8%; top:64px; display:none; pointer-events:none;}
  #boss-bar .nm{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:#e0b0b0; text-align:center; text-shadow:0 1px 2px #000; margin-bottom:3px;}
  #boss-bar .bar{height:14px;} #boss-bar .bar > i{background:linear-gradient(180deg,#c0392b,#6a1010);}

  #pause-btn{position:absolute; top:calc(10px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%); pointer-events:auto;
    width:34px; height:34px; border-radius:50%; border:1px solid var(--edge); background:rgba(0,0,0,.5); color:var(--ink); font-size:14px;}

  /* controls */
  .controls{position:absolute; bottom:calc(20px + env(safe-area-inset-bottom)); left:0; right:0; height:170px; pointer-events:none;}
  #joy-zone{position:absolute; left:0; bottom:0; width:55%; height:100%; pointer-events:auto;}
  .actionpad{position:absolute; right:14px; bottom:0; width:150px; height:150px; pointer-events:none;}
  .act{position:absolute; pointer-events:auto; border-radius:50%; border:1px solid var(--edge);
    background:radial-gradient(60% 60% at 50% 40%,var(--panel2),var(--panel)); color:var(--ink);
    display:flex; align-items:center; justify-content:center; flex-direction:column; box-shadow:var(--shadow);
    font-size:11px; letter-spacing:.06em; text-transform:uppercase;}
  .act:active{transform:scale(.94);}
  .act .cdring{position:absolute; inset:-1px; border-radius:50%; pointer-events:none;}
  .act.attack{width:86px; height:86px; right:0; bottom:6px; border-color:#5c2222; color:var(--gold-bright); background:radial-gradient(60% 60% at 50% 40%,#3a1414,#230d0d); font-size:13px;}
  .act.skill{width:64px; height:64px; right:78px; bottom:70px; border-color:#3a4a6a; color:#a9c6ea; background:radial-gradient(60% 60% at 50% 40%,#1a2536,#111823);}
  .act.dodge{width:60px; height:60px; right:96px; bottom:6px; border-color:#3f5a2a; color:#b6d99a; background:radial-gradient(60% 60% at 50% 40%,#1c2a15,#12180d);}
  .act.disabled{opacity:.45;}
  .act.ctxbtn{display:none; width:94px; height:94px; right:0; bottom:6px; border-color:#7a5a1a; color:#1a1508; font-size:15px; font-weight:700; letter-spacing:.08em;
    background:linear-gradient(180deg,var(--gold-bright),var(--gold)); box-shadow:0 0 26px rgba(230,207,149,.55), var(--shadow); animation:ctxpulse 1s ease-in-out infinite;}
  @keyframes ctxpulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
  #loot-banner{position:absolute; top:60px; left:50%; transform:translateX(-50%); z-index:22; display:none; align-items:center; gap:12px;
    background:rgba(10,8,6,.86); border:1px solid var(--gold); border-radius:22px; padding:7px 10px 7px 16px; box-shadow:var(--shadow);}
  #loot-timer{color:var(--gold-bright); font-size:14px; letter-spacing:.05em; white-space:nowrap;}
  #btn-skip{padding:6px 14px; font-size:13px; display:none;}

  /* ---------- overlays ---------- */
  .overlay{position:absolute; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column;
    background:rgba(6,5,4,.82); z-index:30; padding:24px; text-align:center; backdrop-filter:blur(2px);}
  .overlay.active{display:flex;}
  .died{font-size:clamp(34px,12vw,60px); letter-spacing:.12em; color:var(--blood-bright); text-transform:uppercase; font-weight:700;
    text-shadow:0 3px 0 #000, 0 0 30px rgba(150,20,20,.6);}
  .cleared{font-size:clamp(28px,9vw,46px); letter-spacing:.14em; color:var(--gold-bright); text-transform:uppercase; font-weight:700; text-shadow:0 2px 0 #000,0 0 26px rgba(200,168,98,.4);}
  .ov-sub{color:var(--ink-dim); margin:10px 0 22px; letter-spacing:.06em; font-size:14px; max-width:320px;}
  .ov-btns{display:flex; gap:12px; flex-wrap:wrap; justify-content:center;}

  .chest-art{width:150px; height:150px; margin-bottom:8px;}
  .reward-name{font-size:20px; color:var(--gold-bright); letter-spacing:.06em; margin-top:6px;}
  .reward-sub{color:var(--ink-dim); font-size:13px; margin-top:4px; max-width:300px;}
  .glint{color:var(--soul);}

  #toast{position:absolute; left:50%; bottom:26%; transform:translateX(-50%); z-index:40;
    background:rgba(10,8,6,.9); border:1px solid var(--gold); color:var(--gold-bright); padding:8px 16px; border-radius:20px;
    font-size:13px; letter-spacing:.06em; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none; white-space:nowrap;}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  .hint{color:var(--ink-dim); font-size:11px; text-align:center; padding:4px 14px;}
  .foot-actions{display:flex; gap:10px; padding:0 14px 12px;}
  .foot-actions .btn{flex:1;}

  /* ---------- spell cast buttons (battle, left side) ---------- */
  .spellpad{position:absolute; left:12px; bottom:2px; display:flex; flex-direction:column-reverse; gap:10px; pointer-events:none;}
  .act.spell-cast{position:relative; width:58px; height:58px; border-color:#4a3a6a; color:#d7c4ef; background:radial-gradient(60% 60% at 50% 40%,#241a36,#150f22); font-size:10px; pointer-events:auto; padding:0;}
  .act.spell-cast .lbl{padding:0 4px; line-height:1.05; text-align:center;}

  /* ---------- rune/ability icon & list chevrons ---------- */
  .icn.rune{display:flex; align-items:center; justify-content:center; font-size:18px; color:var(--gold); background:#0d0b09;}
  .slot .icn.rune{width:40px; height:40px;}
  .chev{margin-left:auto; color:var(--ink-dim); font-size:20px; padding-right:2px;}
  .inv-item{cursor:pointer;}

  /* ---------- gear item-detail / picker modal ---------- */
  .menu-overlay{align-items:center; z-index:50;}
  .modal-panel{width:100%; max-width:460px; max-height:88%; margin:0 14px; display:flex; flex-direction:column;
    background:linear-gradient(180deg,var(--panel),var(--bg2)); border:1px solid var(--gold); border-radius:12px;
    box-shadow:var(--shadow); overflow-y:auto; -webkit-overflow-scrolling:touch; text-align:left;}
  .modal-head{position:sticky; top:0; display:flex; align-items:center; justify-content:space-between; padding:12px 14px;
    border-bottom:1px solid var(--edge); background:var(--panel); z-index:2;}
  .modal-head .h{font-size:16px; letter-spacing:.06em; color:var(--gold-bright); text-transform:uppercase;}
  .modal-head .btn{padding:6px 11px; font-size:14px;}
  .modal-scroll{padding:8px 12px;}
  .detail-top{display:flex; gap:12px; align-items:center; padding:12px 14px 4px;}
  .icn-lg{width:64px; height:64px; flex:none; border-radius:10px; border:1px solid var(--edge); background-size:cover;}
  .detail-info .dt-type{font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-dim);}
  .detail-info .dt-lv{font-size:15px; color:var(--gold-bright);}
  .dt-desc{padding:6px 14px; font-size:12.5px; color:var(--ink-dim); font-style:italic;}
  .modal-panel .statgrid{padding:0 14px;}
  .modal-panel .buffline, .modal-panel .card-title{padding-left:14px; padding-right:14px;}
  .modal-panel .inv-item{margin:6px 14px;}
  .detail-actions{display:flex; gap:8px; flex-wrap:wrap; padding:12px 14px 16px;}
  .detail-actions .btn{flex:1; min-width:130px;}

  /* ---------- landscape: let the arena fill, keep menus readable ---------- */
  @media (orientation:landscape){
    #app{max-width:none;}
    #s-home .topbar, #s-home .navbar, #s-home .hero-stage,
    #s-gear .panel-head, #s-gear .scroll, #s-levelup .panel-head, #s-levelup .scroll{
      max-width:640px; margin-left:auto; margin-right:auto; width:100%;
    }
    #portrait{width:min(34vh,240px); height:min(34vh,240px);}
    .controls{height:150px;}
  }

  /* webfont polish (Cinzel display + EB Garamond body); falls back to system serif offline */
  body,.gothic{font-family:"EB Garamond","Palatino Linotype",Georgia,serif;}
  .title,.subtitle,.cleared,.died,.panel-head .h,.card-title,.wave-lbl,.class-tag,.reward-name,.nav-btn .lbl{font-family:"Cinzel","Palatino Linotype",Georgia,serif;}
  .title{font-size:clamp(15px,4.7vw,26px); letter-spacing:.08em;}
</style>
</head>
<body>
<div id="app">

  <!-- ================= HOME ================= -->
  <div id="s-home" class="screen active">
    <div class="topbar">
      <div class="stat-chip">Lv <b id="home-level">1</b></div>
      <div class="stat-chip">Stage <b id="home-stage">1</b></div>
      <div class="stat-chip soul">◈ <b id="home-souls">0</b></div>
    </div>
    <div style="text-align:center; padding:4px 12px 0">
      <div class="title">Fall of the Foul</div>
      <div class="subtitle">Kindle the Fallen</div>
    </div>
    <div class="hero-stage">
      <canvas id="portrait" width="360" height="360"></canvas>
      <div class="plinth"></div>
      <div class="class-tag" id="home-class">Melee</div>
    </div>
    <div class="navbar">
      <div class="nav-btn" id="nav-gear">
        <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 2l2.5 4.5L20 8l-3 4 1 6-6-2.8L6 18l1-6-3-4 5.5-1.5z"/></svg>
        <div class="lbl">Gear</div>
      </div>
      <div class="nav-btn fight" id="nav-fight">
        <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M14 3l7 7-9 9-3-1-1-3 9-9z"/><path d="M4 20l4-4M3 14l3 3"/></svg>
        <div class="lbl">Fight</div>
      </div>
      <div class="nav-btn" id="nav-levelup">
        <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 3v18M6 9l6-6 6 6"/></svg>
        <div class="lbl">Level Up</div>
      </div>
    </div>
  </div>

  <!-- ================= GEAR ================= -->
  <div id="s-gear" class="screen">
    <div class="panel-head">
      <button class="btn ghost" id="gear-back">‹ Back</button>
      <div class="h">Gear</div>
      <div style="width:64px"></div>
    </div>
    <div class="scroll" id="gear-body"><!-- built by ui.js --></div>
  </div>

  <!-- ================= LEVEL UP ================= -->
  <div id="s-levelup" class="screen">
    <div class="panel-head">
      <button class="btn ghost" id="lv-back">‹ Back</button>
      <div class="h">Level Up</div>
      <div class="stat-chip soul">◈ <b id="lv-souls">0</b></div>
    </div>
    <div class="scroll" id="lv-body"><!-- built by ui.js --></div>
  </div>

  <!-- ================= ARENA ================= -->
  <div id="s-arena" class="screen">
    <canvas id="game"></canvas>
    <div id="arena-hud">
      <div class="bars">
        <div class="bar hp"><i id="bar-hp"></i><div class="txt" id="txt-hp">HP</div></div>
        <div class="bar mana"><i id="bar-mana"></i><div class="txt" id="txt-mana">MP</div></div>
        <div class="bar stam"><i id="bar-stam"></i></div>
      </div>
      <div class="arena-top-right">
        <div class="wave-lbl" id="wave-lbl">Stage 1 · Wave 1</div>
        <div class="souls-lbl">◈ <span id="run-souls">0</span></div>
      </div>
      <div id="boss-bar"><div class="nm" id="boss-nm">Boss</div><div class="bar"><i id="bar-boss"></i></div></div>
    </div>
    <button id="pause-btn">II</button>
    <div id="loot-banner"><span id="loot-timer"></span><button class="btn gold" id="btn-skip">Skip ›</button></div>
    <div class="controls">
      <div id="joy-zone"></div>
      <div class="spellpad" id="spellpad"></div>
      <div class="actionpad">
        <button class="act skill" id="btn-skill"><span id="skill-name">Skill</span><svg class="cdring" viewBox="0 0 100 100"><circle id="cd-skill" cx="50" cy="50" r="48" fill="none" stroke="#a9c6ea" stroke-width="3" stroke-dasharray="301.6" stroke-dashoffset="0" transform="rotate(-90 50 50)"/></svg></button>
        <button class="act dodge" id="btn-dodge">Dodge<svg class="cdring" viewBox="0 0 100 100"><circle id="cd-dodge" cx="50" cy="50" r="48" fill="none" stroke="#b6d99a" stroke-width="3" stroke-dasharray="301.6" stroke-dashoffset="0" transform="rotate(-90 50 50)"/></svg></button>
        <button class="act attack" id="btn-attack">Attack</button>
      </div>
      <button class="act ctxbtn" id="btn-open">OPEN</button>
    </div>

    <!-- overlays live inside arena -->
    <div class="overlay" id="ov-result">
      <div id="ov-title" class="died">You Died</div>
      <div class="ov-sub" id="ov-sub"></div>
      <div class="ov-btns" id="ov-btns"></div>
    </div>
    <div class="overlay" id="ov-chest">
      <canvas class="chest-art" id="chest-art" width="150" height="150"></canvas>
      <div class="cleared" style="font-size:22px" id="chest-head">A Chest Appears</div>
      <div class="reward-name" id="reward-name"></div>
      <div class="reward-sub" id="reward-sub"></div>
      <div class="ov-btns" id="chest-btns" style="margin-top:20px"></div>
    </div>
    <div class="overlay" id="ov-pause">
      <div class="cleared" style="font-size:30px">Paused</div>
      <div class="ov-btns" style="margin-top:22px">
        <button class="btn gold" id="pz-resume">Resume</button>
        <button class="btn danger" id="pz-quit">Abandon Run</button>
      </div>
    </div>
  </div>

  <div class="overlay menu-overlay" id="menu-modal"></div>
  <div id="toast"></div>
</div>

<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/art.js"></script>
<script src="js/ui.js"></script>
<script src="js/arena.js"></script>
<script src="js/main.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('service-worker.js').catch(function(){});
    });
  }
</script>
</body>
</html>
